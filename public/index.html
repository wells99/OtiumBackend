
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | OtiumPlayer</title>
  <link rel="shortcut icon" href="ok.png" type="image/x-icon">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-screen bg-gray-950 text-white flex items-center justify-center p-5">
  <main class="w-full max-w-lg min-w-93.75 rounded-2xl border border-gray-800 bg-gray-900 p-8 shadow-xl">
    <div class="mb-7 text-center ">
      <h1 class="text-3xl font-bold">Criar sua conta</h1>
      <p class="mt-2 text-sm text-gray-400">
        Cadastre-se para acessar nossos videos 
      </p>
    </div>

    <form id="register-form" class="space-y-5">
      <div>
        <label for="username" class="mb-2 block text-sm font-medium">
          Nome de usuário
        </label>
        <input
          id="username"
          name="username"
          type="text"
          minlength="3"
          maxlength="30"
          pattern="[A-Za-z0-9_.\-]{3,30}"
          autocomplete="username"
          required
          class="w-full rounded-lg border border-gray-700 bg-gray-800 px-4 py-3 outline-none focus:border-blue-500"
          placeholder="SeuUsuario"
        >
      </div>

      <div>
        <label for="password" class="mb-2 block text-sm font-medium">
          Senha
        </label>
        <input
          id="password"
          name="password"
          type="password"
          minlength="12"
          maxlength="128"
          autocomplete="new-password"
          required
          class="w-full rounded-lg border border-gray-700 bg-gray-800 px-4 py-3 outline-none focus:border-blue-500"
          placeholder="Mínimo de 12 caracteres"
        >
      </div>

      <div>
        <label for="confirm-password" class="mb-2 block text-sm font-medium">
          Confirmar senha
        </label>
        <input
          id="confirm-password"
          name="confirmPassword"
          type="password"
          minlength="12"
          maxlength="128"
          autocomplete="new-password"
          required
          class="w-full rounded-lg border border-gray-700 bg-gray-800 px-4 py-3 outline-none focus:border-blue-500"
          placeholder="Digite a senha novamente"
        >
      </div>

      <p id="feedback" role="status" aria-live="polite"
         class="hidden rounded-lg p-3 text-sm"></p>

      <button
        id="submit-button"
        type="submit"
        class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold transition hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50"
      >
        Criar conta
      </button>
    </form>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
