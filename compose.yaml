services:
  OtiumPlayer:
    build:
      context: .
      dockerfile: Dockerfile
    image: otiumplayer:latest
    container_name: OtiumPlayer
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3005:3000"

    volumes:
      - otium_db_data:/app/prisma

    init: true
    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

volumes:
  otium_db_data:
